[project]
name = "physics-center-api"
version = "0.1.0"
description = "Reviewable scientific document and knowledge linking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
math = ["sympy>=1.13,<2"]

[project.scripts]
physics-eval = "app.modules.evaluation.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.tutor.prompts" = ["*.md"]
"app.modules.evaluation.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
